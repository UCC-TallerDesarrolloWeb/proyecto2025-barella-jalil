  <main class="asesoramiento-main">
    
    <section class="hero-asesoramiento">
      <div class="container">
        <h1>SOLICITAR ASESORAMIENTO</h1>
        <p>Completá el formulario y nos contactaremos a la brevedad</p>
      </div>
    </section>


    <section class="formulario-asesoramiento">
      <div class="container">
        <form id="form-asesoramiento" class="formulario" novalidate>
          
          <div class="form-seccion">
            <h2>Información Personal</h2>

            <div class="form-row">
              <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" autocomplete="given-name" required />
                <span class="error-message" id="error-nombre" aria-live="polite"></span>
              </div>

              <div class="form-group">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" autocomplete="family-name" required />
                <span class="error-message" id="error-apellido" aria-live="polite"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" inputmode="email" autocomplete="email" required />
                <span class="error-message" id="error-email" aria-live="polite"></span>
              </div>

              <div class="form-group">
                <label for="telefono">Teléfono *</label>
                <input type="tel" id="telefono" name="telefono" inputmode="numeric" maxlength="10" placeholder="Ej: 3511234567" required />
                <span class="error-message" id="error-telefono" aria-live="polite"></span>
              </div>
            </div>
          </div>

          
          <div class="form-seccion">
            <h2>Información del Vehículo</h2>

            <div class="form-row">
              <div class="form-group">
                <label for="marca">Marca del vehículo *</label>
                <input type="text" id="marca" name="marca" required />
                <span class="error-message" id="error-marca" aria-live="polite"></span>
              </div>

              <div class="form-group">
                <label for="modelo">Modelo del vehículo *</label>
                <input type="text" id="modelo" name="modelo" required />
                <span class="error-message" id="error-modelo" aria-live="polite"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="patente">Patente *</label>
                <input type="text" id="patente" name="patente" placeholder="ABC123 o AA123BB" required />
                <span class="error-message" id="error-patente" aria-live="polite"></span>
              </div>

              <div class="form-group">
                <label for="uso">Uso principal *</label>
                <select id="uso" name="uso" required>
                  <option value="">Seleccionar uso</option>
                  <option value="urbano">Urbano</option>
                  <option value="rural">Rural</option>
                  <option value="ruta">Ruta</option>
                </select>
                <span class="error-message" id="error-uso" aria-live="polite"></span>
              </div>
            </div>
          </div>

        
          <div class="form-seccion">
            <h2>Mejoras Deseadas</h2>

            <div class="form-group">
              <label>Me gustaría mejoras en:</label>
              <div class="checkbox-group">
                <label class="checkbox-label">
                  <input type="checkbox" name="mejoras" value="mecanicas" /> Mecánicas
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="mejoras" value="esteticas" /> Estéticas
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="mejoras" value="audio" /> De audio
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="mejoras" value="iluminacion" /> De iluminación
                </label>
              </div>
              <span class="error-message" id="error-mejoras" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="importacion">Importación de accesorios *</label>
              <textarea id="importacion" name="importacion" placeholder="Describí qué accesorios te gustaría importar..." required></textarea>
              <span class="error-message" id="error-importacion" aria-live="polite"></span>
            </div>
          </div>


          <div class="form-actions">
            <button type="submit" class="btn-enviar">SOLICITAR ASESORAMIENTO</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
  </main>
